name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: linux
          - os: windows-latest
            platform: windows/amd64
            artifact: windows
            flags: -nsis
          - os: macos-latest
            platform: darwin/universal
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Retried: the Go module proxy occasionally drops a download mid-stream.
      - name: Install Wails CLI
        shell: bash
        run: |
          go version
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "installing wails $version"
          for attempt in 1 2 3; do
            go install "github.com/wailsapp/wails/v2/cmd/wails@$version" && break
            echo "attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          wails version

      - name: Install NSIS for the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $config | ConvertTo-Json -Depth 10 | Set-Content wails.json

      - name: Build
        shell: bash
        run: wails build -platform ${{ matrix.platform }} -trimpath ${{ matrix.flags }}

      # The Linux archive carries the installer that adds the launcher entry.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out pkg/habit-calendar
          cp build/bin/habit-calendar build/appicon.png build/appicon.svg pkg/habit-calendar/
          cp packaging/linux/install.sh packaging/linux/uninstall.sh pkg/habit-calendar/
          chmod +x pkg/habit-calendar/install.sh pkg/habit-calendar/uninstall.sh
          tar -czf out/habit-calendar-linux-amd64.tar.gz -C pkg habit-calendar

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path build/bin/habit-calendar.exe -DestinationPath out/habit-calendar-windows-amd64.zip
          Move-Item build/bin/*installer.exe out/habit-calendar-windows-amd64-installer.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          codesign --force --deep --sign - "build/bin/Habit Calendar.app"
          ditto -c -k --keepParent "build/bin/Habit Calendar.app" out/habit-calendar-macos-universal.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "Habit Calendar $GITHUB_REF_NAME"
          --notes-file .github/release-notes.md
          --verify-tag
